name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jest tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # カバレッジ計測込みで走らせ、package.json の coverageThreshold を下回ったら失敗する。
      # 閾値は 2026-08-01 時点の実測値（statements 92.7% / lines 93.6% / functions 90.7% /
      # branches 88.7%）から数ポイント下に置いた退行検知用のラインで、目標値ではない。
      # 未計測のまま残っているのは Expo テンプレート由来の未使用ファイル群
      # （components/hello-wave.tsx・parallax-scroll-view.tsx・external-link.tsx・
      # ui/collapsible.tsx・themed-text.tsx・themed-view.tsx・hooks/use-theme-color.ts・
      # app/modal.tsx）と、iOS では読み込まれないプラットフォーム別実装
      # （components/ui/icon-symbol.tsx・hooks/use-color-scheme.web.ts）。
      # 前者はテストを足すより削除が筋なので、別途判断する
      - name: Run Jest tests with coverage
        run: npm test -- --ci --coverage

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
